name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: only the publish job can write.
permissions:
  contents: read

# A release run is never cancelled by a later one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag matches Cargo.toml, is on main, and has CHANGELOG notes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $cargo_version"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not on main"; exit 1
          fi
          scripts/changelog-section.sh "$tag" >/dev/null

  # The full CI suite (lint, both-OS tests, real gpg, deny, msrv, docker) must
  # pass before anything is built.
  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.artifact }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 sets the glibc floor at 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: netbox-mcp-linux-amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: netbox-mcp-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: netbox-mcp-darwin-arm64
          # Cross-built on Apple silicon; smoke-tested under Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: netbox-mcp-darwin-amd64
            rosetta: true
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pinned toolchain from rust-toolchain.toml, plus the matrix target.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: make release TARGET=${{ matrix.target }}
      - if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      # macOS runs the x86_64 binary under Rosetta automatically once installed.
      - run: make smoke BIN=target/${{ matrix.target }}/release/netbox-mcp
      - run: cp target/${{ matrix.target }}/release/netbox-mcp ${{ matrix.artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  docker:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docker-smoke ENGINE=docker

  publish:
    name: GitHub Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum netbox-mcp-* > checksums.txt && cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/netbox-mcp-*
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          files: artifacts/*
