name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so newly published RustSec advisories surface without a push.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Same gate as local: clippy over all targets (incl. tests) and both
      # feature sets, plus rustfmt.
      - run: make lint

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo audit
