# cargo-deny policy (`make deny`). Replaces cargo-audit: advisories, banned
# crates, allowed sources, and licenses, checked on every CI run and weekly.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities always fail. Unmaintained crates fail only when we depend on
# them directly; a transitive one is upstream's to replace.
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# TLS uses rustls' ring provider (see Cargo.toml). aws-lc needs cmake + a C
# toolchain and complicates cross builds; it must not come back transitively.
deny = [
    { crate = "aws-lc-sys", reason = "TLS uses the ring provider" },
    { crate = "aws-lc-rs", reason = "TLS uses the ring provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
confidence-threshold = 0.93
# Only GPL-3.0-compatible licenses actually present in the graph. Crates that
# also offer BSL-1.0 (ryu), LGPL-2.1-or-later (r-efi), or Unlicense
# (aho-corasick, memchr, walkdir, …) do so as an OR with MIT/Apache-2.0, so
# those need not be allowed. Add a license here only after checking it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# This crate itself.
exceptions = [{ crate = "netbox-mcp", allow = ["GPL-3.0-or-later"] }]
