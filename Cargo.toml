[package]
name = "netbox-mcp"
version = "0.14.0"
edition = "2024"
# Verified: builds and passes `cargo test --all` on 1.89.0; 1.88 fails (uuid
# needs 1.89). `make msrv` / the msrv CI job keep it honest.
rust-version = "1.89"
description = "An MCP server that exposes NetBox infrastructure data as tools for Claude and other MCP clients, with read plus limited write support"
license = "GPL-3.0-or-later"
repository = "https://github.com/3kirt/netbox-mcp"
keywords = ["netbox", "mcp", "claude", "api", "llm"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "netbox-mcp"
path = "src/main.rs"

[features]
# Live integration tests that hit a real, seeded NetBox instance.
# Off by default so `cargo test` stays fast and offline. See docs/testing.md.
live-tests = []

[dependencies]
rmcp = { version = "3.10", features = [
    "server",
    "macros",
    "transport-io",
] }
tokio = { version = "1", features = ["full"] }
# TLS via rustls with the ring provider, not reqwest's default aws-lc-rs:
# aws-lc-sys needs cmake + a C toolchain and complicates cross builds. The
# provider is installed in `client::http_client()` (reqwest panics without one
# under `rustls-no-provider`); deny.toml bans aws-lc-sys / aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
anyhow = "1"
thiserror = "2"
percent-encoding = "2"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true

# Strictest practical clippy: the pedantic, nursery, and cargo groups are on by
# default for every `cargo clippy` (so the release gate and the Makefile pick
# them up automatically). The `restriction` group is intentionally NOT enabled
# wholesale — it contains mutually contradictory lints. `priority = -1` lets the
# per-lint `allow`s below override the groups.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Unfixable: the transitive dependency tree carries duplicate crate versions.
multiple_crate_versions = "allow"
# Doc comments are prose-heavy and reference many proper nouns and API terms
# (NetBox, IPAM, DCIM, VLAN, VRF, CIDR, FHRP, …); backticking them all is noise.
doc_markdown = "allow"
# `pub(crate)` on shared cross-module helpers is deliberate API-surface control.
redundant_pub_crate = "allow"
# `use rmcp::model::*` is an intentional glob over rmcp's large model module.
wildcard_imports = "allow"
# Pagination/ID casts operate on bounded values: NetBox IDs are i32-range, the
# page limit is clamped to 1..=1000, and offsets are `.max(0)`, so the u64/i32
# conversions can neither truncate nor lose a sign in practice.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
